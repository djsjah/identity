x-required-env:
  RABBITMQ_PORT: ${RABBITMQ_PORT:?required}
  RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:?required}

services:
  rabbitmq:
    image: rabbitmq:4.2.9-management
    hostname: identity-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}

    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rabbitmq_data: